<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>こんねね～！ねっ子早安集點卡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            /* 桃鈴ねね代表色：蜜桃粉橘漸層 */
            background: linear-gradient(135deg, #FFE5EC 0%, #FFC2D1 50%, #FFE8A3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 380px;
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(255, 117, 143, 0.25);
            border: 3px solid #FF8FA3;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* 頂部裝飾條 */
        .top-ribbon {
            background: linear-gradient(90deg, #FF758F, #FFB703);
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 22px;
            color: #D90429;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px #FFE5EC;
        }
        .subtitle {
            font-size: 13px;
            color: #7F5539;
            margin-bottom: 18px;
        }
        .points-badge {
            background: #FFF8E7;
            border: 2px dashed #FFB703;
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        .points-number {
            font-size: 32px;
            font-weight: 900;
            color: #FF758F;
        }
        .points-label {
            font-size: 12px;
            color: #B08968;
            font-weight: bold;
        }
        /* 1x5 集點卡網格 */
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 22px;
        }
        .stamp-slot {
            aspect-ratio: 1;
            background: #FFF0F3;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #FFB3C1;
            font-weight: bold;
            border: 2px dashed #FFB3C1;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .stamp-slot.checked {
            background: linear-gradient(135deg, #FFCCD5 0%, #FFF3B0 100%);
            border: 2px solid #FF758F;
            color: #D90429;
            font-size: 22px;
            transform: scale(1.06) rotate(-3deg);
            box-shadow: 0 4px 10px rgba(255, 117, 143, 0.2);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 117, 143, 0.3);
        }
        .btn-primary {
            background: linear-gradient(90deg, #FF758F 0%, #FF8FA3 100%);
            color: white;
            margin-bottom: 10px;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            background: #E5E5E5;
            color: #999;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-success {
            background: linear-gradient(90deg, #FFB703 0%, #FB8500 100%);
            color: white;
            display: none;
            animation: bounce 1.2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .status-msg {
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #FF4D6D;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="top-ribbon">🍑 NEKKO MORNING CLUB 🥟</div>
        <h1>こんねね～！早安集點</h1>
        <p class="subtitle">優秀的ねっ子每天準時起床，集滿 5 點換獎勵！</p>

        <div class="points-badge">
            <div class="points-number" id="pointsDisplay">0 / 5</div>
            <div class="points-label">🐾 目前收集的ねね印章 🐾</div>
        </div>

        <!-- 5格集點卡視覺化 -->
        <div class="stamp-grid" id="stampGrid"></div>

        <button class="btn btn-primary" id="checkInBtn" onclick="checkIn()">🍑 こんねね！起床簽到 (+1)</button>
        <button class="btn btn-success" id="redeemBtn" onclick="redeemPrize()">🎁 集滿 5 點！兌換禮品卡</button>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        const TOTAL_POINTS = 5;
        const STORAGE_KEY = 'neneWakeUpData';

        // 蓋章圖案：水蜜桃與餃子輪流，第5格是皇冠
        const STAMP_ICONS = ['🍑', '🥟', '🍑', '🥟', '👑'];

        // ねね風格早安應援語錄
        const CHEER_MESSAGES = [
            'こんねね～！今天也準時起床太棒了！🍑',
            '不愧是優秀的ねっ子！獎勵你一個大大的印章 🥟',
            'またねね～！今天也要元氣滿滿地加油喔！✨',
            '早起的ねっ子有餃子吃！繼續保持吧～🧡'
        ];

        function getDefaultUserData() {
            return {
                points: 0,
                lastCheckInDate: ''
            };
        }

        function loadUserData() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                if (!storedData) return getDefaultUserData();

                const parsedData = JSON.parse(storedData);
                const validPoints = Number.isInteger(parsedData.points)
                    ? Math.min(Math.max(parsedData.points, 0), TOTAL_POINTS)
                    : 0;

                return {
                    points: validPoints,
                    lastCheckInDate: typeof parsedData.lastCheckInDate === 'string'
                        ? parsedData.lastCheckInDate
                        : ''
                };
            } catch (error) {
                // 若資料損毀或瀏覽器禁止存取 localStorage，使用安全的預設值。
                console.warn('無法讀取集點資料，已重設為初始狀態：', error);
                return getDefaultUserData();
            }
        }

        let userData = loadUserData();

        function saveUserData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
            } catch (error) {
                console.warn('無法儲存集點資料：', error);
            }
        }

        function initApp() {
            renderGrid();
            updateUI();
            checkTodayStatus();
        }

        function renderGrid() {
            const grid = document.getElementById('stampGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_POINTS; i++) {
                const slot = document.createElement('div');
                const isChecked = i <= userData.points;
                slot.className = `stamp-slot ${isChecked ? 'checked' : ''}`;
                slot.innerHTML = isChecked ? STAMP_ICONS[i - 1] : `🐾<span style="font-size:10px;">${i}</span>`;
                grid.appendChild(slot);
            }
        }

        function updateUI() {
            document.getElementById('pointsDisplay').innerText = `${userData.points} / ${TOTAL_POINTS}`;

            const checkInBtn = document.getElementById('checkInBtn');
            const redeemBtn = document.getElementById('redeemBtn');

            if (userData.points >= TOTAL_POINTS) {
                checkInBtn.style.display = 'none';
                redeemBtn.style.display = 'block';
            } else {
                checkInBtn.style.display = 'block';
                redeemBtn.style.display = 'none';
            }
        }

        function getTodayStr() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        }

        function checkTodayStatus() {
            const today = getTodayStr();
            const msg = document.getElementById('statusMsg');
            const btn = document.getElementById('checkInBtn');

            if (userData.lastCheckInDate === today && userData.points < TOTAL_POINTS) {
                btn.disabled = true;
                btn.innerText = '今天已簽到完成囉 ✓';
                if (!msg.innerText) {
                    msg.innerText = '明天也要記得來找ねね簽到喔！🍑';
                }
            } else {
                btn.disabled = false;
                btn.innerText = '🍑 こんねね！起床簽到 (+1)';
            }
        }

        function checkIn() {
            const today = getTodayStr();
            if (userData.lastCheckInDate === today) return;

            if (userData.points < TOTAL_POINTS) {
                userData.points += 1;
                userData.lastCheckInDate = today;
                saveUserData();

                renderGrid();
                updateUI();

                const msg = document.getElementById('statusMsg');
                if (userData.points === TOTAL_POINTS) {
                    msg.innerText = '🎉 恭喜集滿 5 點！快點擊下方兌換禮品卡吧！';
                } else {
                    const randomMsg = CHEER_MESSAGES[Math.floor(Math.random() * CHEER_MESSAGES.length)];
                    msg.innerText = randomMsg;
                }
                checkTodayStatus();
            }
        }

        function redeemPrize() {
            if (userData.points < TOTAL_POINTS) return;

            alert('🍑 こんねね～！恭喜ねっ子集滿 5 點！\n請截圖此畫面兌換你的專屬禮品卡 🎁');
            userData.points = 0;
            saveUserData();
            initApp();

            const msg = document.getElementById('statusMsg');
            msg.innerText = '新一輪集點卡開始囉！繼續加油 🥟';
        }

        initApp();
    </script>
</body>
</html>
